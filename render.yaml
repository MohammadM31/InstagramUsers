services:
  - type: web
    name: growthengine-api
    runtime: docker
    envVars:
      - {key: DATABASE_URL, fromDatabase: {name: ge-db, property: connectionString}}
      - {key: REDIS_URL, fromService: {type: keyvalue, name: ge-redis, property: connectionString}}
      - {key: INLINE_WORKER, value: "1"}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ENCRYPTION_KEY, sync: false}
      - {key: LLM_API_KEY, sync: false}
      - {key: LLM_BASE_URL, sync: false}
      - {key: REPLICATE_API_TOKEN, sync: false}
      - {key: CORS_ORIGIN, sync: false}
  - type: keyvalue
    name: ge-redis
    ipAllowList: []
databases:
  - name: ge-db
